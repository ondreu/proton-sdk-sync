name: macOS

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run check-types
      - run: npm test
